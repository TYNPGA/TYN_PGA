<!DOCTYPE html>

<head>

    <title>PGA | Tyn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0b0b0f;
            color: white;
            display: flex;
            justify-content: center;

            padding: 25px;

            width: 100%;

            width: 100%;
            padding: 18px;

            font-size: 18px;
            font-weight: bold;
            border: 1px solid #292933;
            transition: 0.2s;

        .link:hover {
            transform: scale(1.03);

        }
