<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGA | Tyn</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #063d0b 0%, transparent 38%),
        linear-gradient(145deg, #020603, #031406 55%, #000000);
    display: flex;
    justify-content: center;
    padding: 35px 18px;
}

.container {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

.logo {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #020602;
    border: 3px solid #5cff38;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: bold;
    color: #72ff4d;
    box-shadow:
        0 0 15px #39ff14,
        0 0 40px rgba(57, 255, 20, 0.45);
}

h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    color: #70ff50;
    font-size: 16px;
    margin-bottom: 32px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.link {
    display: flex;
    align-items: center;
    min-height: 76px;
    padding: 12px 20px;
    border-radius: 22px;
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    background: rgba(0, 30, 5, 0.55);
    border: 2px solid #39ff14;
    box-shadow:
        0 0 12px rgba(57, 255, 20, 0.2),
        inset 0 0 20px rgba(57, 255, 20, 0.04);
    transition: 0.2s;
}

.link:hover {
    transform: translateY(-3px);
    background: rgba(20, 70, 20, 0.5);
    box-shadow:
        0 0 25px rgba(57, 255, 20, 0.45);
}

.icon {
    width: 55px;
    font-size: 27px;
    margin-right: 12px;
}

.link span:last-child {
    flex: 1;
}

.arrow {
    color: #72ff4d;
    font-size: 30px;
}

.footer {
    margin-top: 32px;
    color: #72ff4d;
    font-size: 15px;
}

@media (max-width: 400px) {
    body {
        padding: 25px 14px;
    }

    h1 {
        font-size: 32px;
    }

    .link {
        min-height: 68px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">PGA</div>

    <h1>Tyn</h1>

    <div class="subtitle">
        Mis redes y contenido ✨
    </div>

    <div class="links">

        <a class="link" href="https://www.tiktok.com/@tyncreator" target="_blank">
            <span class="icon"><img src="PGA_TikTok_icon.png" alt="TikTok"></span>
            <span>TikTok</span>
            <span class="arrow">›</span>
        </a>

        <a class="link" href="https://www.roblox.com/users/profile?username=uhggtyn" target="_blank">
            <span class="icon"><img src="PGA_Roblox_icon.png" alt="Roblox"></span>
            <span>Roblox</span>
            <span class="arrow">›</span>
        </a>

        <a class="link" href="https://www.youtube.com/@iityn_pgaii" target="_blank">
            <span class="icon"><img src="PGA_YouTube_icon.png" alt="YouTube"></span>
            <span>YouTube</span>
            <span class="arrow">›</span>
        </a>

    </div>

    <div class="footer">
        PGA • Tyn
    </div>

</div>

</body>
</html>
